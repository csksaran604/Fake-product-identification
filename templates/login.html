{% extends "base.html" %}

{% block title %}Admin Authentication{% endblock %}

{% block content %}
<div class="container container-narrow" style="padding-top: 2rem;">
  <div class="card" style="max-width: 480px; margin: 0 auto; border-color: rgba(99, 102, 241, 0.3);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="width: 56px; height: 56px; font-size: 1.6rem; margin: 0 auto 1rem;">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 style="font-size: 1.75rem;">Administrator Login</h2>
      <p style="font-size: 0.9rem;">Access product registration and blockchain ledger management.</p>
    </div>

    <!-- Demo Credentials Notice -->
    <div style="background: rgba(99, 102, 241, 0.1); border: 1px dashed rgba(99, 102, 241, 0.4); border-radius: var(--radius-md); padding: 0.85rem 1rem; margin-bottom: 1.5rem; font-size: 0.85rem;">
      <div style="font-weight: 600; color: var(--primary-light); margin-bottom: 0.25rem;">
        <i class="fa-solid fa-key"></i> Demo College Project Credentials:
      </div>
      <div style="display: flex; justify-content: space-between; color: #cbd5e1; font-family: 'JetBrains Mono', monospace; font-size: 0.82rem;">
        <span>Username: <strong>admin</strong></span>
        <span>Password: <strong>admin123</strong></span>
      </div>
    </div>

    <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
      <div class="form-group">
        <label for="username" class="form-label">Username <span class="req">*</span></label>
        <div style="position: relative;">
          <input 
            type="text" 
            name="username" 
            id="username" 
            class="form-control" 
            placeholder="Enter admin username" 
            value="admin"
            required 
            autofocus
          >
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password <span class="req">*</span></label>
        <div style="position: relative;">
          <input 
            type="password" 
            name="password" 
            id="password" 
            class="form-control" 
            placeholder="Enter password" 
            value="admin123"
            required
          >
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In to Portal
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem;">
      <a href="{{ url_for('index') }}" style="color: var(--text-dim);">
        <i class="fa-solid fa-arrow-left"></i> Return to Homepage
      </a>
    </div>
  </div>
</div>
{% endblock %}
